[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfie"
version = "0.1.0"
description = "Shelfie - PySide6 desktop scaffold"
authors = [{name = "Shelfie Team"}]
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.7",
]

[project.scripts]
shelfie = "shelfie.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
